version: '3.8'

services:
  # Elasticsearch 服务：作为 Jaeger 的存储后端
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0 # 使用稳定的 7.x 版本
    container_name: jaeger-elasticsearch
    ports:
      - "9200:9200"      # HTTP API 端口，用于 Jaeger 连接和调试
      - "9300:9300"      # 集群通信端口
    environment:
      - discovery.type=single-node          # 单节点模式运行
      - ES_JAVA_OPTS=-Xms512m -Xmx512m      # 设置 JVM 堆内存大小
      - xpack.security.enabled=false        # 禁用安全功能（开发环境）
    volumes:
      - ./es-data:/usr/share/elasticsearch/data # 挂载数据卷，防止容器重启后数据丢失
    networks:
      - jaeger-net

  # Jaeger All-in-one 服务：包含收集器、查询服务和 UI
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "6831:6831/udp"
    environment:
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
      # 添加/修改这些配置
      - ES_INDEX_PREFIX=jaeger
      - ES_USE_ALIASES=false  # 先禁用别名简化问题
      - ES_CREATE_INDEX_TEMPLATES=true  # 自动创建索引模板
      - ES_NUM_SHARDS=5
      - ES_NUM_REPLICAS=1
    depends_on:
      - elasticsearch
    networks:
      - jaeger-net



# 定义网络，让 Jaeger 和 ES 可以互相通信
networks:
  jaeger-net:
    driver: bridge